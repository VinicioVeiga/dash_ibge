# Redis 7.2 é a linha com licença BSD-3-Clause, de uso gratuito.
# O dashboard só precisa de PING, GET e SETEX.
services:
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
